    <script>
      // 在首屏绘制前应用主题，避免深浅色闪烁
      try {
        var saved = localStorage.getItem('filmline-theme')
        document.documentElement.classList.toggle('dark', saved !== 'light')
      } catch (error) {
        /* 隐私模式下 localStorage 不可用，保持默认深色 */
      }
    </script>
